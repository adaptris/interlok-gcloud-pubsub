plugins {
  id "java-library"
  id "maven-publish"
  id "jacoco"
  id "com.github.spotbugs" version "6.5.12"
  id "org.sonarqube" version "6.3.1.5724"
  id "org.owasp.dependencycheck" version "12.2.2"
  id "io.freefair.lombok" version "8.14.2"
}

ext {
  interlokCatalogVersion = project.findProperty('interlokCatalogVersion') ?: '5.0-SNAPSHOT'
  interlokCoreVersion = project.findProperty('interlokCoreVersion') ?: interlokCatalogVersion
  releaseVersion = project.findProperty('releaseVersion') ?: interlokCatalogVersion
  nexusBaseUrl = project.findProperty('nexusBaseUrl') ?: 'https://nexus.adaptris.net/nexus'
  mavenPublishUrl = project.findProperty('mavenPublishUrl') ?: nexusBaseUrl + '/content/repositories/snapshots'
  javadocsBaseUrl = nexusBaseUrl + "/content/sites/javadocs/com/adaptris"
  repoUsername = project.findProperty('repoUsername') ?: 'unknown'
  repoPassword = project.findProperty('repoPassword') ?: 'unknown'
  defaultNexusRepo = project.findProperty('defaultNexusRepo') ?: 'unknown'
  interlokJavadocs= project.findProperty('interlokJavadocs') ?: javadocsBaseUrl + "/interlok-core/" + interlokCoreVersion
  interlokCommonJavadocs= project.findProperty('interlokCommonJavadocs') ?: javadocsBaseUrl + "/interlok-common/" + interlokCoreVersion
  interlokCatalogPlatform = "com.adaptris:interlok-version-catalog:${interlokCatalogVersion}"
  offlineJavadocPackageDir = new File(project.buildDir, "offline-javadoc-packages")

  delombokTargetDir = new File("${project.projectDir}/src/main/generated")

  componentName='Interlok Google/GCloud PubSub'
  componentDesc="Consuming and producing messages via Google Cloud PubSub"

  organizationName = "Adaptris Ltd"
  organizationUrl = "http://interlok.adaptris.net"
}

ext.gitBranchNameOrTimestamp = { branchName ->
  if (branchName.equals("HEAD") || branchName.equals("develop") || branchName.startsWith("release")) {
    return new Date().format('HH:mm:ss z');
  }
  return branchName;
}

ext.buildInfo = { ->
   new ByteArrayOutputStream().withStream { os ->
      exec {
        executable = "git"
        args = ["rev-parse", "--abbrev-ref", "HEAD"]
        standardOutput = os
      }
      def branchName = os.toString().replaceAll("\r", "").replaceAll("\n", "").trim();
      return gitBranchNameOrTimestamp(branchName);
    }
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17
group   = 'com.adaptris'
version = releaseVersion
def versionDir = "$buildDir/version"
lombok.disableConfig = true

sonar {
  properties {
    property "sonar.projectKey", "adaptris_interlok-gcloud-pubsub"
    property "sonar.organization", "adaptris-org"
    property "sonar.host.url", "https://sonarcloud.io"
  }
}

// Disable gradle module generation since we probably don't want
// xxx.module files in your repository.
allprojects {
  tasks.withType(Jar) {
    metaInf {
      from ("$rootDir") {
        include 'LICENSE*'
        include 'NOTICE*'
      }
    }
  }
  tasks.withType(GenerateModuleMetadata) {
    enabled = false
  }
}

repositories {
  mavenCentral()
  if (defaultNexusRepo != "unknown") {
    maven {
      url "$defaultNexusRepo"
      allowInsecureProtocol true
    }
  }
  maven { url "$nexusBaseUrl/content/groups/public" }
  maven { url "$nexusBaseUrl/content/groups/interlok" }
}


configurations {
  javadoc {}
  offlineJavadocPackages {}
  all*.exclude group: 'c3p0'
  all*.exclude group: 'commons-logging'
  all*.exclude group: 'javamail'
  all*.exclude group: 'javax.mail', module: 'mail'
  all*.exclude group: 'org.glassfish.hk2.external'
  all*.exclude group: 'xalan', module: 'xalan'
  all*.exclude group: 'net.sf.saxon', module: 'saxon'
  all*.exclude group: 'org.codehaus.woodstox'
  all*.exclude group: 'org.eclipse.jetty.orbit', module: 'javax.mail.glassfish'
  // INTERLOK-3197 exclude old javax.mail
  all*.exclude group: 'com.sun.mail', module: 'javax.mail'
  all*.exclude group: 'javax.validation', module: 'validation-api'
  all*.exclude group: 'javax.activation', module: 'activation'
  all*.exclude group: 'javax.activation', module: 'javax.activation-api'

  // INTERLOK-3740 switch from jcraft to com.github.mwiede jsch fork.
  all*.exclude group: 'com.jcraft', module: 'jsch'
}

configurations.all {
  resolutionStrategy.cacheChangingModulesFor 0, "seconds"
  // Our dependency graph contains the hacky listenablefuture, Gradle will now report that those libraries contain duplicates of Guava classes.
  // We need to tell Gradle to select Guava. https://github.com/google/guava/releases/tag/v32.1.0
  resolutionStrategy.capabilitiesResolution.withCapability("com.google.guava:listenablefuture") {
    select("com.google.guava:guava:0")
  }
}

dependencies {
  api platform(interlokCatalogPlatform)
  implementation platform(interlokCatalogPlatform)
  compileOnly platform(interlokCatalogPlatform)
  annotationProcessor platform(interlokCatalogPlatform)
  testImplementation platform(interlokCatalogPlatform)
  testCompileOnly platform(interlokCatalogPlatform)
  testRuntimeOnly platform(interlokCatalogPlatform)

  api  ("com.adaptris:interlok-core") { changing= true}
  api  ("com.adaptris:interlok-common") { changing= true}
  api  ("com.adaptris:interlok-oauth-gcloud") { changing= true}

  api ("com.google.cloud:google-cloud-pubsub") {
    exclude group: "com.fasterxml.jackson.core", module: "jackson-databind"
    exclude group: "com.apache.httpcomponents", module: "httpclient"
    exclude group: "io.grpc", module: "grpc-netty-shaded"
  }
  api ("org.apache.httpcomponents:httpclient")
  api ("commons-codec:commons-codec")
  // Dependency to platform/BOM
  implementation (platform("com.fasterxml.jackson:jackson-bom"))
  api ("com.fasterxml.jackson.core:jackson-databind")
  api ("com.google.guava:guava")

  // Minimal netty specification
  implementation ("io.netty:netty-handler")
  implementation ("io.netty:netty-handler-proxy")
  implementation ("io.netty:netty-transport-native-epoll")
  implementation ("io.netty:netty-codec")
  implementation ("io.netty:netty-codec-http2")
  implementation ("io.netty:netty-codec-http")

  implementation ("io.grpc:grpc-netty")
  implementation ("io.grpc:grpc-protobuf")
  implementation ("io.grpc:grpc-stub")
  implementation ("io.grpc:grpc-googleapis")
  implementation ("io.grpc:grpc-services")

  // Some things appear to be pinned at 1.28.1 which refers to a missing class
  // in 1.29.0; gradle dependencies was required.
  implementation  ("io.grpc:grpc-auth")
  implementation  ("io.grpc:grpc-alts")
  implementation  ("io.grpc:grpc-context")
  implementation  ("io.grpc:grpc-inprocess")

  implementation  ("com.google.code.gson:gson")
  // Required because we attempt to create a protobuf message in PUSH_RESPONSE_TO_INTERLOK
  implementation ("com.google.protobuf:protobuf-java-util")
  implementation ("com.google.protobuf:protobuf-java")


  annotationProcessor ("com.adaptris:interlok-core-apt") {changing= true}

  testImplementation ("org.junit.jupiter:junit-jupiter-engine")
  testImplementation ("org.junit.platform:junit-platform-launcher")
  testImplementation ("org.slf4j:slf4j-simple")
  testImplementation ("com.adaptris:interlok-stubs") { changing= true }
  testImplementation ("org.mockito:mockito-core")
  testImplementation ("org.mockito:mockito-inline")

  testImplementation  ("org.apache.geronimo.specs:geronimo-jms_1.1_spec")
  testImplementation  ("com.jayway.jsonpath:json-path")
  testImplementation  ("com.google.api.grpc:grpc-google-cloud-pubsub-v1")
  testImplementation("com.google.api:gax-grpc") {
      artifact {
          classifier = "testlib"
      }
  }

  javadoc platform(interlokCatalogPlatform)
  javadoc("com.adaptris:interlok-core-apt") { changing= true}

  offlineJavadocPackages platform(interlokCatalogPlatform)
  offlineJavadocPackages ("com.adaptris:interlok-core:javadoc@jar") { changing= true}
  offlineJavadocPackages ("com.adaptris:interlok-common:javadoc@jar") { changing= true}
}

jar {
  manifest {
    attributes("Built-By": System.getProperty('user.name'),
               "Build-Jdk": System.getProperty('java.version'),
               "Implementation-Title": componentName,
               "Implementation-Version": project.version,
               "Implementation-Vendor-Id": project.group,
               "Implementation-Vendor": organizationName)
  }
}

sourceSets {
  main {
    output.dir(versionDir, builtBy: 'generateVersion')
  }
}
// Generate the META-INF/adaptris-version file
task generateVersion {
  doLast {
    def versionFile = new File(new File(versionDir, 'META-INF'), 'adaptris-version')
    versionFile.getParentFile().mkdirs()
    ant.propertyfile(file: versionFile) {
      entry(key: 'component.name', value: componentName)
      entry(key: 'component.description', value: componentDesc)
      entry(key: 'build.version', value: releaseVersion)
      entry(key: 'groupId', value: project.group)
      entry(key: 'artifactId', value: project.name)
      entry(key: 'build.date', value: new Date().format('yyyy-MM-dd'))
      entry(key: 'build.info', value: buildInfo())
    }
  }
}

task offlinePackageList(type: Copy) {
  description 'Build an offline package-list for javadocs'
  group 'Documentation'

  project.configurations.offlineJavadocPackages.collect { dependency ->
    from(zipTree(dependency)) {
      into dependency.name
    }
  }
  include "package-list"
  include "element-list"
  into offlineJavadocPackageDir
}

javadoc {
  dependsOn "offlinePackageList"
  configure(options) {
    def coreJavadocDir = new File(offlineJavadocPackageDir, "interlok-core-${interlokCoreVersion}-javadoc.jar")
    def commonJavadocDir = new File(offlineJavadocPackageDir, "interlok-common-${interlokCoreVersion}-javadoc.jar")
    if (new File(coreJavadocDir, 'element-list').exists()) {
        options.linksOffline(interlokJavadocs, coreJavadocDir.getCanonicalPath())
    }
    if (new File(commonJavadocDir, 'element-list').exists()) {
        options.linksOffline(interlokCommonJavadocs, commonJavadocDir.getCanonicalPath())
    }
    taglets = ["com.adaptris.taglet.ConfigTaglet", "com.adaptris.taglet.LicenseTaglet"]
    options.addStringOption "tagletpath", configurations.javadoc.asPath
    options.addStringOption "Xdoclint:none", "-quiet"
    title= componentName
  }
}

jacocoTestReport {
  reports {
    xml.required= true
    html.required= true
  }
}

task javadocJar(type: Jar, dependsOn: javadoc) {
  classifier = 'javadoc'
  from javadoc.destinationDir
}

task examplesJar(type: Jar, dependsOn: test) {
  classifier = 'examples'
  from new File(buildDir, '/examples')
}

task sourcesJar(type: Jar, dependsOn: classes) {
    classifier = 'sources'
    from sourceSets.main.allSource
}

artifacts {
  archives javadocJar
  archives examplesJar
  archives sourcesJar
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java

      artifact javadocJar { classifier "javadoc" }
      artifact examplesJar { classifier "examples" }
      artifact sourcesJar { classifier "sources" }

      pom.withXml {
        asNode().appendNode("name", componentName)
        asNode().appendNode("description", componentDesc)
        asNode().appendNode("url", "https://interlok.adaptris.net/interlok-docs/#/")
        def properties = asNode().appendNode("properties")
        properties.appendNode("target", "3.6.3+")
        properties.appendNode("tags", "google,gcloud")
        properties.appendNode("license", "false")
        properties.appendNode("repository", "https://github.com/adaptris/interlok-gcloud-pubsub")
        properties.appendNode("readme", "https://github.com/adaptris/interlok-gcloud-pubsub/raw/develop/README.md")
      }
    }
  }
  repositories {
    maven {
      credentials {
        username repoUsername
        password repoPassword
      }
      url mavenPublishUrl
    }
  }
}

spotbugsMain {
  effort = com.github.spotbugs.snom.Effort.valueOf("MAX")
  reportLevel = com.github.spotbugs.snom.Confidence.valueOf("HIGH")
  reports {
    xml {
      required.set(false)
    }
    html {
      required.set(true)
      stylesheet = 'default.xsl'
    }
  }
  includeFilter = new File("$rootDir/gradle/spotbugs-filter.xml")
}

dependencyCheck  {
  suppressionFiles= [ "https://raw.githubusercontent.com/adaptris/interlok/develop/gradle/owasp-exclude.xml" , "$rootDir/gradle/owasp-exclude.xml"]
  scanConfigurations = [ "api", "compileClasspath", "runtimeClasspath" ]
  formats = [ "HTML", "JUNIT" ]
  junitFailOnCVSS = 7.0
  failBuildOnCVSS = 7.0
  nvd {
    apiKey = System.getenv("NVD_API_KEY")
    delay=project.findProperty("dependencyCheckNvdDelay")
    datafeedUrl=project.findProperty("dependencyCheckNvdDatafeedUrl")
  }
  analyzers {
    assemblyEnabled=false
	ossIndex {
	  username = System.getenv("OSS_INDEX_USERNAME")
	  password = System.getenv("OSS_INDEX_PASSWORD")
  	  warnOnlyOnRemoteErrors = true
    }
    kev {
      url = project.findProperty('dependencyCheckKnownExploitedURL')
    }
  }
}

delombok {
  target = delombokTargetDir
}

task lgtmCompile(type: JavaCompile, dependsOn: delombok) {
  group 'Build'
  description 'Compile for lgtm'

  source = sourceSets.main.extensions.delombokTask
  destinationDirectory= sourceSets.main.java.classesDirectory
  classpath = project.sourceSets.main.compileClasspath
}

task deleteGeneratedFiles(type: Delete) {
  delete delombokTargetDir
}

test {
  useJUnitPlatform()
}

// disable spotbugsTests which checks our test code..
spotbugsTest.enabled = false

clean.dependsOn deleteGeneratedFiles
check.dependsOn jacocoTestReport
javadoc.dependsOn offlinePackageList
